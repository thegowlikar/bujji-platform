# Bujji Options OS -- Shadow Mode configuration.
#
# This is NOT config/config.yaml. This file belongs ONLY to
# bujji_options_os_runner.py (the Trading Session Governor stack). It has
# zero overlap with the legacy ORB-VWAP bot's configuration -- see
# docs/SYSTEM_OWNERSHIP.md for the full ownership map. The legacy
# config/config.yaml is never read by this runner, and this file is never
# read by bujji/app.py.
#
# shadow_mode is always true in Phase-1 -- there is no live-broker mode for
# this runner. See the Phase-1 design audit for what "Category C" work
# (live broker, MIC, restart recovery) is explicitly deferred.

shadow_mode: true

logging:
  namespace: bujji-options-os-shadow

session:
  underlying: NIFTY
  # Cross-check only -- the runner reads the authoritative lot size from
  # the FYERS instrument master and warns if this disagrees (audit
  # 2026-07-19: master said 65 while this file said 75).
  exchange_lot_size: 65
  desired_quantity: 1
  requested_risk: 5000.0
  proposed_trade_effect:
    additional_margin: 10000.0
    additional_max_loss: 5000.0
  direction: null
  expected_move_pct: null

exit_policy:
  profit_target_fraction: 0.5
  max_loss_fraction: 1.0
  mandatory_exit_time: "15:15:00"

capital_snapshot:
  # OPERATOR DECLARATION 2026-08-18: this paper campaign simulates Rs 5,00,000
  # of capital, declared by the operator -- not a hidden default (the old
  # `capital_snapshot: {}` silently fabricated Rs 1cr) and not broker reality
  # (a live get_funds() probe the same day showed the real account holds
  # Rs 0.00; `source: fyers_funds` remains available and becomes the right
  # setting the day real money funds the account). Margin stays REAL
  # (providers.margin: fyers_certified) -- real exchange margin sized against
  # declared simulated capital is exactly what paper trading claims to be.
  #
  # daily_loss_limit preserves the pre-existing 5% ratio (was 5L on the old
  # 1cr fabrication); max_allowed_drawdown unchanged at 0.20. Both are
  # operator-owned -- adjust deliberately, never by default.
  source: static
  total_capital: 500000.0
  available_capital: 500000.0
  peak_capital: 500000.0
  used_margin: 0.0        # true at session start: PaperBroker opens flat
  open_risk: 0.0          # true at session start: no open positions
  reserved_risk: 0.0
  daily_pnl: 0.0
  consecutive_losses: 0
  daily_loss_limit: 25000.0
  max_allowed_drawdown: 0.20

providers:
  # Margin provider for the risk context (Gate C). Three honest states:
  #   simulated         -- test-fixture margin, margin_verified=True with NO
  #                        broker behind it (how every session before
  #                        2026-08-18 ran, disclosed here rather than implied).
  #   fyers_uncertified -- real whole-book SPAN quotes from the live-certified
  #                        endpoint (2026-07-19, docs/CAPITAL_MANAGEMENT_ENGINE.md),
  #                        margin_verified=False -> capital_check VETOes entries.
  #   fyers_certified   -- same real quotes, verified=True. OPERATOR DECISION:
  #                        flip only after reviewing
  #                        data_certification/fyers_whole_book_span_margin_discovery_*.json
  margin:
    # OPERATOR DECISION 2026-08-21: set to `simulated`, superseding the
    # 2026-08-18 decision recorded below. NOT a withdrawal of that
    # certification -- it still holds, and options_os_paper_trading.yaml
    # (market_data: fyers_live) keeps using fyers_certified. The difference is
    # THIS file's chain.
    #
    # WHY. This config pairs `market_data: replay_chain` with a real margin
    # provider, and the two blocks were selected independently -- nothing
    # coupled them. A ReplayChainProvider chain carries NSE bhavcopy
    # `FinInstrmNm` symbols ("NIFTY26AUG24000CE"), which are real at NSE but
    # have never been shown valid at the FYERS execution venue. Gate B is
    # provider-agnostic: it sends whatever the chain carries to the live SPAN
    # endpoint. So this session was one `--bhavcopy-path` away from quoting
    # NSE-form symbols at FYERS.
    #
    # It never caused a visible incident, and that is the uncomfortable part:
    # FYERS almost certainly rejects the un-prefixed form, so the path failed
    # closed BY ACCIDENT (verified=False -> MARGIN_NOT_CERTIFIED -> VETO)
    # rather than by design. That is exactly how the two-vocabulary defect
    # survived unnoticed for months.
    #
    # `_guard_provider_vocabulary` (bujji_options_os_runner.py) now REFUSES
    # to start this pairing, so leaving fyers_certified here would make this
    # config unstartable. `simulated` is the honest setting for a replay
    # session: it never touches a broker, and its own warning names itself
    # every run so nobody mistakes it for real margin.
    #
    # ---- superseded, retained for the record ----
    # OPERATOR DECISION 2026-08-18: flipped to fyers_certified by the operator
    # after reviewing the live whole-book evidence in
    # data_certification/fyers_whole_book_span_margin_discovery_20260818.json
    # (request shape accepted; parser interprets the real response; span/expo/
    # benefit figures real; back-to-back calls deterministic). This satisfies
    # CertifiedWholeBookMarginProvider's human-confirmation contract.
    type: simulated

  market_data:
    type: replay_chain          # ReplayChainProvider -- the only Phase-1 implementation
    bhavcopy_path: null         # REQUIRED -- must be set via config or --bhavcopy-path before running
  regime:
    type: human_supplied        # HumanSuppliedRegimeProvider -- the only Phase-1 implementation
    trend_regime: null          # REQUIRED -- must be set explicitly; the runner fails closed if missing
    volatility_regime: null     # REQUIRED -- must be set explicitly; the runner fails closed if missing

artifacts:
  shadow_sessions_root: shadow_sessions
  journal_path: data/options_os_shadow_position_group_journal.db
