# Bujji ORB-VWAP ATM Seller — configuration.
# Secrets (FYERS app id / access token) come from environment variables:
#   FYERS_APP_ID, FYERS_ACCESS_TOKEN — never put them in this file.

log_level: INFO

market:
  underlying: NIFTY
  exchange: NSE
  strike_interval: 50
  lot_size: 75
  expiry_selection: nearest_weekly
  # FYERS supplies real index volume in historical candles, so VWAP is a true
  # volume-weighted VWAP. Keep this false in production: if a feed ever reports
  # no volume, the bot stands down instead of trading on an approximation.
  vwap_equal_weight_fallback: false

timing:
  candle_minutes: 5
  orb_start: "09:15"
  orb_end: "09:20"
  trading_start: "09:20"
  trading_end: "15:05"
  hard_exit: "15:05"

risk:
  # This is now a CEILING, not a fixed quantity -- the Capital Management
  # Engine (bujji/capital/) may approve FEWER lots than this if available
  # broker margin does not support it, but will never approve more. See
  # docs/CAPITAL_MANAGEMENT_ENGINE.md.
  lots: 1
  # Only this fraction of available broker margin may be allocated to a
  # trade; the rest stays unused headroom. 0.90 = use at most 90%.
  margin_safety_buffer: 0.90
  # Capital policy -- see docs/CAPITAL_MANAGEMENT_ENGINE.md for the full
  # contract. Current setting (STRICT) means: no trade will be placed
  # unless a broker-CERTIFIED margin figure is available. As of this
  # writing FYERS's margin-calculator endpoint is UNCERTIFIED in this
  # codebase (see AUDIT_LOG.md) -- so with STRICT + fyers_paper, entries
  # will be blocked until either (a) the endpoint is live-verified and
  # margin_provider_certified is set true below, or (b) this is
  # deliberately relaxed to ESTIMATED or SIMULATION for paper trading.
  #   STRICT     -- only certified broker margin; safest, blocks otherwise.
  #   ESTIMATED  -- uses estimated_margin_per_lot below (operator guess).
  #   SIMULATION -- uses simulated_margin_per_lot below (synthetic; replay/dev).
  #   CERTIFIED  -- broker margin calculator; ALSO requires
  #                 margin_provider_certified: true below.
  #
  # LIVE-CERTIFIED 2026-07-19 against a real FYERS account -- see
  # docs/AUDIT_LOG.md Pass 8 and docs/CAPITAL_MANAGEMENT_ENGINE.md for the
  # full raw request/response evidence, error-code behavior, multi-leg
  # hedging-benefit verification, and repeatability proof.
  capital_policy: CERTIFIED
  # estimated_margin_per_lot: 130000   # required if capital_policy: ESTIMATED
  simulated_margin_per_lot: 100000
  margin_provider_certified: true
  max_mtm_loss: 6000
  daily_loss_limit: 6000
  breakout_body_ratio: 0.60

strategy:
  max_trades_per_day: 1
  allow_reentry: false

broker:
  # paper       — fully synthetic: no live data, no live orders.
  # fyers_paper — Paper Trading mode: LIVE FYERS market data (candles, quotes,
  #               option prices, contract resolution), but every order is
  #               placed/tracked exclusively in the paper ledger. No real
  #               order can be placed in this mode — see docs/PAPER_TRADING_LIVE_DATA.md.
  #               Recommended mode for the paper-trading campaign.
  # fyers       — full live trading. Real orders, real capital.
  name: fyers_paper
  retry_attempts: 3
  retry_backoff_seconds: 1.5
  poll_interval_seconds: 1.0
  order_timeout_seconds: 15.0

paths:
  log_dir: logs
  data_dir: data
  journal_csv: data/trade_journal.csv
  database: data/bujji.db
  state_file: data/session_state.json
  lock_file: data/bujji.lock

dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8787
  refresh_seconds: 5
  # Show a STALE warning if the status hasn't updated for this many seconds.
  # Must stay above the 5-min candle cadence (the status advances at most once
  # per completed candle while idle); 420s flags a genuinely missed candle.
  stale_after_seconds: 420
