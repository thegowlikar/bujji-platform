# =========================================================================
# TOKEN GATE (2026-08-21)
#
# CANONICAL COPY, added to the repository 2026-08-22. This file previously
# existed only at
# /etc/systemd/system/bujji-options-os-trading.service.d/token-gate.conf.
#
# bujji-token-preflight already answered, at 08:45, whether the FYERS token
# outlives today's fires. On 2026-08-20 it answered FAIL -- correctly; the
# token had died at 06:00 -- named this very unit among the six it would
# take down, printed the exact remediation, and stayed `failed` as the
# alarm. Then every one of those six timers fired anyway.
#
# It was a detector with no actuator: right, loud, early, and attached to
# nothing.
#
# Requires= makes systemd RE-RUN the pre-flight immediately before this unit
# and refuse to start it when the verdict is FAIL. The check is therefore
# fresh at the moment it matters rather than a stale 08:45 opinion, and it
# costs ~150ms -- it decodes a JWT locally and calls no broker.
#
# FAIL-CLOSED, DELIBERATELY. If the pre-flight itself breaks, this unit does
# not run. That is the correct trade: a blocked day is loud and the operator
# refreshes the token, while a day spent authenticating against a dead token
# stays silent until someone reads the logs -- which on 2026-08-18 took
# until 18:00, a full session too late. Intraday option-chain data cannot be
# backfilled, so the loud failure is strictly cheaper than the quiet one.
#
# NOT applied to bujji-backup.timer: a backup must still run when the token
# is dead. That is exactly when it matters most.
#
# Reversible per-unit: delete this drop-in and daemon-reload.
#
# INSTALL (not performed by this repository):
#   sudo mkdir -p /etc/systemd/system/bujji-options-os-trading.service.d
#   sudo cp deploy/bujji-options-os-trading.service.d/token-gate.conf \
#           /etc/systemd/system/bujji-options-os-trading.service.d/
#   sudo systemctl daemon-reload
# =========================================================================
[Unit]
Requires=bujji-token-preflight.service
After=bujji-token-preflight.service
