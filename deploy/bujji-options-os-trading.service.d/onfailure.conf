# =========================================================================
# THE ALERT WIRING FOR THE TRADING UNIT.
#
# CANONICAL COPY. This file is the repository's declaration of the desired
# configuration. Until 2026-08-22 it existed ONLY at
# /etc/systemd/system/bujji-options-os-trading.service.d/onfailure.conf, so
# the alert path that turns a failed session into an operator notification
# was not version-controlled, not reviewable, and not recoverable if the
# host were rebuilt.
#
# WHAT IT BUYS. `bujji_options_os_runner` distinguishes its outcomes by exit
# code, and the base unit sets NO SuccessExitStatus= -- so only exit 0 is
# success and EVERY non-zero code reaches this alert without needing to be
# enumerated here:
#
#   0  EXIT_OK                 certified: safe AND provable
#   1  EXIT_CONFIG_ERROR       refused to start
#   2  EXIT_RUNTIME_ERROR      crashed
#   3  EXIT_UNSAFE_SESSION     something is wrong
#   4  EXIT_PENDING_EVIDENCE   nothing known to be wrong, but the session
#                              cannot prove what it saw
#
# Codes 3 and 4 are the two the safety verdict produces, and both must reach
# an operator. Adding SuccessExitStatus= to the base unit would silently
# undo that, which tests/test_pending_evidence_cannot_pass.py refuses.
#
# INSTALL (not performed by this repository):
#   sudo mkdir -p /etc/systemd/system/bujji-options-os-trading.service.d
#   sudo cp deploy/bujji-options-os-trading.service.d/onfailure.conf \
#           /etc/systemd/system/bujji-options-os-trading.service.d/
#   sudo systemctl daemon-reload
# =========================================================================
[Unit]
OnFailure=bujji-alert@%n.service
